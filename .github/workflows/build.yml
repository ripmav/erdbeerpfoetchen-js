name: Build & Bundle

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build bundle
        run: npm run build

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: erdbeerpfoetchen-js-${{ github.ref_name }}
          path: dist/erdbeerpfoetchen.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/erdbeerpfoetchen.js
